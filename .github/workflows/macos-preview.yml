name: macOS preview

on:
  push:
    branches: [codex/macos-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build the Apple Silicon app
        run: |
          xcodebuild -version
          xcodebuild -quiet -project PixelLiftAI.xcodeproj -scheme PixelLiftAI \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/pixellift" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build
      - name: Run offline macOS tests
        run: swift test --package-path Packages/PixelLiftCore
      - name: Verify and archive the application
        run: |
          app="$RUNNER_TEMP/pixellift/Build/Products/Release/PixelLift AI.app"
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/PixelLift AI")" = arm64
          du -sk "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/PixelLiftAI-macOS-arm64.zip"
          shasum -a 256 "$RUNNER_TEMP/PixelLiftAI-macOS-arm64.zip"
      - name: Save the macOS preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PixelLiftAI-macOS-arm64
          path: ${{ runner.temp }}/PixelLiftAI-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish the downloadable preview
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v1.0.2-macos-preview
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The published preview already exists. This build is available as an artifact."
            exit 0
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          app="$RUNNER_TEMP/pixellift/Build/Products/Release/PixelLift AI.app"
          zip="$RUNNER_TEMP/PixelLiftAI-macOS-arm64.zip"
          cat > "$notes" <<'NOTES'
          Apple Silicon 搭載の Mac（macOS 14 以降）で試せるプレビュー版です。**PixelLiftAI-macOS-arm64.zip** をダウンロードして展開し、**PixelLift AI.app** を開いてください。Xcode のインストールは不要です。初期設定の Mock は API キーなしで使えます。

          Replicate へのアップロードの送信方法を変更し、応答内容を安全に判別できるようにしました。設定の **Replicateのアップロードを診断** では、テスト画像を1枚送信して応答を確認できます。診断は予測を作成しません。

          GitHub Actions の macOS 環境でアプリをビルドし、オフラインテストを実行しました。このビルドはアドホック署名で、Apple の公証は未実施です。起動時に macOS が確認を表示する場合があります。[Apple の案内](https://support.apple.com/ja-jp/102445)
          NOTES
          printf '\nアプリ本体のディスク使用量は %s KiB です。\n' \
            "$(du -sk "$app" | awk '{print $1}')" >> "$notes"
          printf '\n[ビルド・テスト記録](%s/%s/actions/runs/%s)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$notes"
          gh release create "$tag" "$zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'PixelLift AI 1.0.2 macOS Preview' \
            --notes-file "$notes" --prerelease
