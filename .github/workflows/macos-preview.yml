name: macOS preview

on:
  push:
    branches: [codex/macos-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build the Apple Silicon app
        run: |
          xcodebuild -version
          xcodebuild -quiet -project PixelLiftAI.xcodeproj -scheme PixelLiftAI \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/pixellift" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build
      - name: Run offline macOS tests
        run: swift test --package-path Packages/PixelLiftCore
      - name: Verify and archive the application
        run: |
          app="$RUNNER_TEMP/pixellift/Build/Products/Release/PixelLift AI.app"
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/PixelLift AI")" = arm64
          du -sk "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/PixelLiftAI-macOS-arm64.zip"
          shasum -a 256 "$RUNNER_TEMP/PixelLiftAI-macOS-arm64.zip"
      - name: Build and verify the drag-to-install disk image
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/pixellift/Build/Products/Release/PixelLift AI.app"
          dmg="$RUNNER_TEMP/PixelLiftAI-macOS-arm64.dmg"
          venv="$RUNNER_TEMP/pixellift-dmg"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip --disable-pip-version-check install 'dmgbuild==2.0.0'

          # Use the system-wide flush if this runner's sync has no per-volume option.
          if ! sync --file-system "$RUNNER_TEMP" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/pixellift-tools"
            printf '%s\n' '#!/bin/sh' 'exec /bin/sync' > "$RUNNER_TEMP/pixellift-tools/sync"
            chmod +x "$RUNNER_TEMP/pixellift-tools/sync"
            export PATH="$RUNNER_TEMP/pixellift-tools:$PATH"
          fi
          "$venv/bin/dmgbuild" -s .github/dmg/settings.py -D "app=$app" "PixelLift AI 1.0.2" "$dmg"
          hdiutil verify "$dmg"

          mounted="$(mktemp -d "$RUNNER_TEMP/pixellift-mount.XXXXXX")"
          trap 'hdiutil detach "$mounted" >/dev/null 2>&1 || true; rmdir "$mounted" 2>/dev/null || true' EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mounted"
          test "$(readlink "$mounted/Applications")" = /Applications
          test -f "$mounted/.background.tiff"
          codesign --verify --deep --strict "$mounted/PixelLift AI.app"
          cmp "$app/Contents/MacOS/PixelLift AI" "$mounted/PixelLift AI.app/Contents/MacOS/PixelLift AI"
          "$venv/bin/python" - "$mounted" <<'PYTHON'
          from pathlib import Path
          import sys
          from ds_store import DSStore

          with DSStore.open(str(Path(sys.argv[1]) / ".DS_Store"), "r") as store:
              assert store["PixelLift AI.app"]["Iloc"] == (155, 120)
              assert store["Applications"]["Iloc"] == (485, 120)
              assert store["."]["icvp"]["backgroundType"] == 2
          print("Finder icon locations and the arrow background are present")
          PYTHON
          shasum -a 256 "$dmg"
      - name: Save the macOS preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PixelLiftAI-macOS-arm64
          path: |
            ${{ runner.temp }}/PixelLiftAI-macOS-arm64.zip
            ${{ runner.temp }}/PixelLiftAI-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Publish the downloadable preview
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v1.0.2-macos-preview
          notes="$RUNNER_TEMP/release-notes.md"
          app="$RUNNER_TEMP/pixellift/Build/Products/Release/PixelLift AI.app"
          zip="$RUNNER_TEMP/PixelLiftAI-macOS-arm64.zip"
          dmg="$RUNNER_TEMP/PixelLiftAI-macOS-arm64.dmg"
          cat > "$notes" <<'NOTES'
          Apple Silicon 搭載の Mac（macOS 14 以降）で試せるプレビュー版です。**PixelLiftAI-macOS-arm64.dmg** を開き、左の **PixelLift AI.app** を右の **Applications** にドラッグしてインストールしてください。ZIP も用意しています。Xcode のインストールは不要です。初期設定の Mock は API キーなしで使えます。

          Replicate へのアップロードの送信方法を変更し、応答内容を安全に判別できるようにしました。設定の **Replicateのアップロードを診断** では、テスト画像を1枚送信して応答を確認できます。診断は予測を作成しません。

          GitHub Actions の macOS 環境でアプリをビルドし、オフラインテストを実行しました。このビルドはアドホック署名で、Apple の公証は未実施です。起動時に macOS が確認を表示する場合があります。[Apple の案内](https://support.apple.com/ja-jp/102445)
          NOTES
          printf '\nアプリ本体のディスク使用量は %s KiB です。\n' \
            "$(du -sk "$app" | awk '{print $1}')" >> "$notes"
          printf '\n[ビルド・テスト記録](%s/%s/actions/runs/%s)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$notes"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq '.assets[].name' | grep -Fxq "$(basename "$dmg")"; then
              gh release upload "$tag" "$dmg" --repo "$GITHUB_REPOSITORY"
            fi
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          else
            gh release create "$tag" "$zip" "$dmg" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'PixelLift AI 1.0.2 macOS Preview' \
              --notes-file "$notes" --prerelease
          fi
